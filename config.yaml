# ai-web2api 配置
server:
  host: 0.0.0.0
  port: 8000
  # 会话绑定（thread_id）：空闲回收 TTL（秒）/ 同时活跃上限 / 是否并行
  thread_ttl: 900
  max_threads: 8
  thread_parallel: true
  cors_origins: ["*"]

browser:
  headless: false         # 首次登录需要看到浏览器窗口；登录完成后可改为 true
  login_check_interval: 300
  state_save_interval: 600

profiles_dir: profiles

providers:
  deepseek:
    url: https://chat.deepseek.com
    models:
      - {name: deepseek-web, ui_label: "DeepSeek 最新版"}
      - {name: deepseek-r1-web, ui_label: "DeepSeek-R1"}
    selectors:
      # 每个字段都是候选列表：按顺序取第一个在页面上匹配的（UI 改版容错）
      input:
        - "textarea[name=search]"        # 2025-08 新版 UI 实测
        - "textarea"                     # 兜底：聊天页通常只有一个 textarea
        - "#chat-input"                  # 旧版 UI
      send_button: []                    # 空 = 用回车发送
      response_container:
        - "[class*=markdown]"            # 待实测确认
        - ".ds-markdown"                 # 旧版 UI
      thinking_container:
        - "[class*=think]"
        - ".ds-think"
      stop_button: []                    # 填了可加快"生成结束"判定
      login_check: []                    # 空 = 用 input 选择器判定登录
      new_chat_button:                   # 发送前点\"开启新对话\"，隔离账号历史会话（防上下文污染）
        - "text=开启新对话"
        - "div.ds-button:has-text(\"新对话\")"
    model_aliases:                       # 客户端（llama_index 等）默认模型名 → 本 provider 模型
      gpt-4: deepseek-web
      gpt-4o: deepseek-web
      gpt-4o-mini: deepseek-web
      gpt-3.5-turbo: deepseek-web
    login:
      mode: auto                  # auto = 用 .env 凭据自动登录；manual = 手动弹窗
      username_env: DEEPSEEK_USERNAME
      password_env: DEEPSEEK_PASSWORD
      page:
        password_tab:             # 默认是验证码 tab 时，切到"密码登录"
          - "div[role=button]:has-text(\"密码登录\")"
        username:                 # 2026-08 实测：无 id/name，placeholder 定位
          - "input[placeholder=\"请输入手机号/邮箱地址\"]"
          - "input[placeholder*=手机号]"
          - "input[type=text]"
        password:
          - "input[placeholder=\"请输入密码\"]"
          - "input[type=password]"
        submit:
          - "div.ds-button--primary"
          - "button[type=submit]"
    queue: {max_size: 10, timeout: 60}
    response_timeout: 180
    poll_interval: 0.2
    stable_polls: 12
    min_wait_before_stable: 8.0
    thread_busy_timeout: 20.0  # resume 时发送后无新容器即判定页面忙（上一请求未完成）
