# ai-web2api 配置
server:
  host: 0.0.0.0
  port: 8000
  # 会话绑定（thread_id）：空闲回收 TTL（秒）/ 同时活跃上限 / 是否并行
  thread_ttl: 900
  max_threads: 8
  thread_parallel: true
  thread_persist: true  # thread_id → DeepSeek 会话 URL id 落盘，重启后 goto 恢复
  cors_origins: ["*"]
  # 常见 OpenAI 模型名（gpt-4 等）兜底别名挂给哪个 provider；空 = 第一个启用的 provider
  default_provider: deepseek

  repo_url: https://github.com/yaohuiwu/ai-web2api  # UI 顶部 Star 入口 + 星标数（空 = 隐藏）
  # 实时画面（只读）：/ui/browser.html 看当前 provider 的浏览器画面
  # ⚠ 接口无鉴权：同网段可见你已登录的浏览器；对外暴露请自行加反代鉴权（见 docs/LIVE_VIEW.md §5.4）
  live_view: true          # 总开关；false = 直播接口一律 403
  live_control: false      # 预留：输入注入（P2），默认关
  live_fps: 5              # 默认帧率（生成中自动降到 1，避免抢占自动化）
  live_quality: 50         # 默认 JPEG 质量
browser:
  headless: true          # 静默运行（不弹浏览器窗口）；由 .env 覆盖：
                          # 优先级 WEB2API_HEADLESS > DEEPSEEK_HEADLESS(<PROVIDER>_HEADLESS) > 本项
                          # 需要看得见窗口（自动登录被验证码拦住时手动登录）：DEEPSEEK_HEADLESS=false 重启
  # 页面语言必须 zh-CN：选择器文案（深度思考/开启新对话/密码登录）都是中文，
  # Playwright 默认 en-US 时 DeepSeek 会渲染英文 UI → 这些选择器全部失配
  locale: zh-CN
  login_check_interval: 900   # 定时登录态检测间隔（秒）。Qwen 对高频访问敏感，不宜过短
  state_expiry_margin: 86400 # 登录态剩余有效期低于该值才落盘 state.json（秒）；已登录且未过期则不反复写
  auth_expiry_warn_days: 3 # 「认证即将过期」默认预警阈值（天）；手动认证 provider 可自行覆盖（见 chatgpt）
  # 定时状态检测：独立开关 + 默认 headless（即使主浏览器 headed 也不弹窗）
  status_check: true      # 定时检测登录态/保存状态总开关
  status_check_headless: false  # 用主上下文检测（独立 headless 会被 Qwen 这类站点对第二实例限流 → 误报未登录）

profiles_dir: profiles

providers:
  deepseek:
    url: https://chat.deepseek.com
    session_url: "{base}/a/chat/s/{id}"  # thread 恢复 URL 模板（{base}=url 去尾斜杠）
    network:
      url_pattern: "/api/v0/chat/completion"  # XHR 监听 URL（生成页面级抓取脚本）
    models:
      - {name: deepseek-web, ui_label: "DeepSeek 最新版"}
      - {name: deepseek-r1-web, ui_label: "DeepSeek-R1"}
    selectors:
      # 每个字段都是候选列表：按顺序取第一个在页面上匹配的（UI 改版容错）
      input:
        - "textarea[name=search]"        # 2025-08 新版 UI 实测
        - "textarea"                     # 兜底：聊天页通常只有一个 textarea
        - "#chat-input"                  # 旧版 UI
      send_button: []                    # 空 = 用回车发送
      response_container:
        # 2026-08 实测：正文容器 class 为 "ds-markdown ds-assistant-message-main-content"。
        # 注意思考区内部也有一个裸 ".ds-markdown"（思考内容走 markdown 渲染，且先于正文
        # 出现）——任何能匹配思考区的选择器都不能出现在候选里：_find_new 会在思考阶段
        # 就锁定它，正文永远提取不到。故只能用组合选择器精确匹配正文。
        - ".ds-markdown.ds-assistant-message-main-content"
        - ".ds-assistant-message-main-content"
      thinking_container:
        - ".ds-think-content"            # 2026-08 实测：思考内容容器
        - ".ds-think"                    # 旧版 UI
        - "[class*=think]"
      stop_button: []                    # 填了可加快"生成结束"判定
      login_check: []                    # 空 = 用 input 选择器判定登录
      new_chat_button:                   # 发送前点\"开启新对话\"，隔离账号历史会话（防上下文污染）
        - "text=开启新对话"
        - "text=New chat"                # 兜底：万一 UI 渲染成英文
        - "div.ds-button:has-text(\"新对话\")"
      # 模式区：2026-09 起 DeepSeek 把\"快速/专家/识图\"三模式合并为单一模式，
      # 新对话页只剩两个开关（深度思考/智能搜索），请求体也只有 thinking_enabled /
      # search_enabled（model_type 恒为 default）。故 mode_button 留空：API 的 mode
      # 参数由驱动翻译成开关组合（fast=都关 / expert=都开 / image=都关，见
      # DeepSeekProvider.MODE_PRESETS），未知 mode 只记日志不再报 400。
      # 若旧版 UI 回归，填回：fast: ['div[role=radio]:has-text("快速模式")'] 等
      mode_button: {}
      mode_checked: []
      # 开关（toggle，2026-09 实测：div.ds-toggle-button，选中态 --selected + aria-pressed=true）
      toggle_button:                     # API 字段名 → 候选选择器（中英文各一份）
        deep_think: ['div.ds-toggle-button:has-text("深度思考")', 'div.ds-toggle-button:has-text("DeepThink")']
        search: ['div.ds-toggle-button:has-text("智能搜索")', 'div.ds-toggle-button:has-text("Search")']
      toggle_checked:                    # 判断开关已开
        - '.ds-toggle-button--selected'
        - 'div.ds-toggle-button[aria-pressed="true"]'
      upload_input:                      # 附件上传入口（input[type=file]；模式合并后任何会话/模式都可用）
        - 'input[type=file]'
    model_aliases:                       # 客户端（llama_index 等）默认模型名 → 本 provider 模型
      gpt-4: deepseek-web
      gpt-4o: deepseek-web
      gpt-4o-mini: deepseek-web
      gpt-3.5-turbo: deepseek-web
    login:
      mode: auto                  # auto = 用 .env 凭据自动登录；manual = 手动弹窗
      username_env: DEEPSEEK_USERNAME
      password_env: DEEPSEEK_PASSWORD
      page:
        password_tab:             # 默认是验证码 tab 时，切到"密码登录"
          - "div[role=button]:has-text(\"密码登录\")"
        username:                 # 2026-08 实测：无 id/name，placeholder 定位
          - "input[placeholder=\"请输入手机号/邮箱地址\"]"
          - "input[placeholder*=手机号]"
          - "input[type=text]"
        password:
          - "input[placeholder=\"请输入密码\"]"
          - "input[type=password]"
        submit:
          - "div.ds-button--primary"
          - "button[type=submit]"
    queue: {max_size: 10, timeout: 60}
    response_timeout: 180
    poll_interval: 0.2
    stable_polls: 12
    min_wait_before_stable: 8.0
    thread_busy_timeout: 20.0  # resume 时发送后无新容器即判定页面忙（上一请求未完成）

  # Qwen Chat（chat.qwen.ai）。模型/模式/附件都是下拉菜单或固定 input，全部配置化。
  # 登录页独立（/auth）；凭据放 .env：QWEN_USERNAME / QWEN_PASSWORD。
  qwen:
    enabled: false            # 暂不注册（UI / `/v1/models` / `/healthz` 里都不出现）；需要时改回 true
    driver: qwen
    url: https://chat.qwen.ai/
    locale: zh-CN
    session_url: "{base}/c/{id}"  # 实测：chat.qwen.ai/c/<uuid>
    # network: 待实测 Qwen 的流式端点后再配；暂不配 → 走 DOM 兜底
    models:
      # 对外模型名 = 原模型名小写 + -web（与 deepseek-web 区分）
      - {name: qwen3.8-max-web, ui_label: "Qwen3.8-Max"}
      - {name: qwen3.7-plus-web, ui_label: "Qwen3.7-Plus"}
      - {name: qwen3.8-omni-flash-web, ui_label: "Qwen3.8-Omni-Flash"}
    selectors:
      input:
        - "textarea.message-input-textarea"
      send_button:                  # 实测：输入后才渲染的圆形发送按钮
        - "button.send-button"
        - ".chat-prompt-send-button"
      response_container:           # 实测：正文（流式期间可能还没加上 phase-answer）
        - ".response-message-content.phase-answer"
        - ".response-message-content"
        - ".custom-qwen-markdown"
        - ".qwen-markdown"
      thinking_container:           # 实测：思考状态卡（内容为“已经完成思考”，非全文）
        - ".qwen-chat-thinking-status-card-content"
      stop_button: []
      login_check:                  # 登录后才有（侧栏可能收起，用账号头像更稳）
        - ".user-profile-desktop"
        - "text=新建对话"
      new_chat_button:
        - "text=新建对话"
      model_menu:                  # 顶部模型下拉
        trigger: ["span.ant-dropdown-trigger"]
        option: ['div[role=option]:has-text("{label}")']
        current: ["span.ant-dropdown-trigger"]
      mode_menu:                   # 输入框右侧模式下拉：自动/思考/快速
        trigger: [".qwen-thinking-selector .qwen-chat-v2-dropdown-menu-trigger"]
        option:
          - 'div[role=option]:has-text("{label}")'
          - '.qwen-chat-v2-dropdown-menu-item:has-text("{label}")'
        current: [".qwen-thinking-selector .qwen-chat-v2-dropdown-menu-select-label"]
        labels: {auto: "自动", thinking: "思考", fast: "快速"}
      attachment_menu:              # “+” → “上传附件” 菜单项 → 系统文件选择器
        trigger: [".mode-select-open"]
        item:
          - '.qwen-chat-v2-dropdown-menu-item:has-text("上传附件")'
          - 'text=上传附件'
        file_input: ["input#filesUpload"]   # 兑底（部分场景可直接 set）
        preview: [".file-card-list"]       # 上传完成的判定
    login:
      mode: auto
      url: https://chat.qwen.ai/auth
      # 认证有效期以这两个 cookie 判定（实测 ~29 天）；auto 认证只展示、不提醒
      auth_cookies: ["token", "refresh_token"]
      username_env: QWEN_USERNAME
      password_env: QWEN_PASSWORD
      page:
        password_tab:              # 部分入口默认验证码登录，需先切“使用密码登录”
          - "text=使用密码登录"
          - "button:has-text(\"使用密码登录\")"
        splash:                    # 加载遮罩：点击前等它消失，否则拦截点击
          - "#splash-screen"
        username:
          - "input[name=email]"
          - "input[type=email]"
        password:
          - "input[name=password]"
          - "input[type=password]"
        submit:
          - "button:has-text(\"登录\")"
          - "button[type=submit]"
    queue: {max_size: 10, timeout: 60}
    response_timeout: 180
    poll_interval: 0.2
    stable_polls: 20
    min_wait_before_stable: 10.0
    # 0 = 关闭忙检测：Qwen 走 DOM 兜底，首帧容器可能 >20s 才出现，否则误判"页面正忙"
    thread_busy_timeout: 0

  # ChatGPT（chatgpt.com）。**无密码自动登录** → login.mode: manual，用 CLI/UI 导入 state。
  # 选择器为候选值，需登录后实测校准（见 docs/PROVIDER_CHATGPT.md）。
  chatgpt:
    driver: chatgpt
    url: https://chatgpt.com/
    locale: en-US               # ChatGPT 默认英文 UI，选择器用英文 aria-label
    session_url: "{base}/c/{id}"  # 会话 URL: chatgpt.com/c/<uuid>
    models:
      - {name: gpt-5-web,  ui_label: "GPT-5"}
      - {name: gpt-4o-web, ui_label: "GPT-4o"}
      - {name: o3-web,     ui_label: "o3"}
    selectors:
      input:                    # contenteditable（ProseMirror）
        - "#prompt-textarea"
        - "div.ProseMirror[contenteditable='true']"
      type_prompt: true         # contenteditable/React → 逐字输入
      stream_content: false     # markdown 重渲染严重 → 正文缓冲后一次性发（避免 diff 丢内容）
      send_button:
        - 'button[data-testid="send-button"]'
        - 'button[aria-label="Send prompt"]'
      stop_button:              # 生成中用停止按钮判定结束（可靠）
        - 'button[data-testid="stop-button"]'
      response_container:
        - '[data-message-author-role="assistant"] .markdown'
      thinking_container: []    # o 系列思考结构待实测
      login_check:              # 登录后才有的账号入口
        - '[data-testid="accounts-profile-button"]'
        - '[aria-label="Open profile menu"]'
      new_chat_button:
        - 'a[data-testid="create-new-chat-button"]'
        - '[aria-label="New chat"]'
      model_menu:               # 顶部模型切换下拉
        trigger: ['button[data-testid="model-switcher-dropdown-button"]']
        option:
          - '[role="menuitemradio"]:has-text("{label}")'
          - '[role="option"]:has-text("{label}")'
      attachment_menu:          # "+" → 上传/添加照片与文件
        trigger: ['button[data-testid="composer-plus-btn"]', 'button[aria-label*="Add"]']
        item:
          - '[role="menuitem"]:has-text("Add photos & files")'
          - '[role="menuitem"]:has-text("Upload")'
        file_input: ['#upload-files', 'input[type="file"]']
    login:
      mode: manual
      hint: "ChatGPT 无密码登录；请用 python -m ai_web2api.cli login chatgpt 或 /ui 导入 state"
      # 认证有效期以 session-token 判定（实测 ~90 天）
      auth_cookies: ["__Secure-next-auth.session-token*"]
      expiry_warn_days: 7   # 手动认证：提前 7 天提醒更新认证信息
    queue: {max_size: 10, timeout: 60}
    response_timeout: 180
    send_confirm_timeout: 20  # 发出去但没开始生成 → 重发一次并快速失败（别死等 180s）
    poll_interval: 0.2
    stable_polls: 30
    min_wait_before_stable: 15.0
    thread_busy_timeout: 0

  # Kimi（kimi.com）：**已实测校准**（输入/发送/正文/登录判定/附件/会话URL）
  # 限制：正文缓冲后发送（思考与正文同 segment）；站点无停止按钮；登录只有 微信扫码/手机号+验证码 → 手动
  kimi:
    enabled: true
    driver: kimi
    url: https://www.kimi.com/
    locale: zh-CN
    session_url: "{base}/chat/{id}"   # 会话 URL 模板（thread 恢复用）
    models:
      - {name: kimi-web, ui_label: "Kimi"}
    selectors:
      input:
        - ".chat-input-editor"
        - "div[contenteditable='true']"
      type_prompt: true
      stream_content: false     # 思考与正文同处一段 → 缓冲后一次发，避免把"思考已完成…"当正文
      response_all_new: true    # 一次回答可能被拆成"工具前 + 工具后"多条消息 → 新容器全部拼接
      include_frames: true      # 地图/小部件在跨域 iframe 里 → 附上链接与可见文本
      widget_capture: both      # 组件捕获：html(可交互) + png(截图兜底)，见 docs/WIDGET_CAPTURE.md
      dismiss_button:           # 弹窗遮挡输入 → 出现即点掉（实测：繁忙排队的「我知道了」）
        - 'button[data-testid="confirm-dialog-cancel"]'
      busy_hint:                # 出现 = 站点在排队/限制 → 给明确错误（而不是干等）
        - '.modal-container[data-testid="confirm-dialog"]:has-text("订阅会员")'
        - '.modal-container[data-testid="confirm-dialog"]:has-text("优先队列")'
      send_button:
        - ".send-button-container"
      response_container:       # 实测：答案的 .markdown-container **不带** toolcall-content-text（带的是思考）
        - ".chat-content-item-assistant .markdown-container:not(.toolcall-content-text) .markdown"
      thinking_container:       # 真实推理文本（**不要**用宽泛的 .toolcall-rollup：它会带上
        - ".chat-content-item-assistant .markdown-container.toolcall-content-text"
        - ".chat-content-item-assistant .toolcall-rollup"   # 兜底：混有 UI 文案，仅窄选择器失效时用
      stop_button: []           # 实测：站点无停止按钮 → 靠 stable_polls 判结束
      login_check:              # 实测：登录后才有头像（未登录也能输入，必须靠它判定）
        - ".user-area__main img"
      upload_input:
        - "input.hidden-input[type='file']"
        - "input[type=file]"
      new_chat_button:          # ⚠ 未实测（缺失不影响：无状态请求直接开新页面）
        - "[class*='new-chat']"
    login:
      mode: manual
      # 登录态在 localStorage：access_token 仅几分钟（前端按需刷新），
      # refresh_token 才是真正有效期（JWT exp，实测约 90 天）→ 用它做倒计时/到期提醒
      auth_local_storage: ["refresh_token"]
      hint: "Kimi 仅支持微信扫码 / 手机号+验证码（易盾验证码）→ 用 python -m ai_web2api.cli login kimi 或 /ui 导入 state"
    queue: {max_size: 10, timeout: 60}
    response_timeout: 180
    poll_interval: 0.2
    stable_polls: 20
    min_wait_before_stable: 8.0

  # 豆包（doubao.com）：**仅手动登录**（无密码登录）；容器内会提示「受区域限制，请先登录」
  # 选择器只有 composer/消息容器是实测的，其余待登录后校准 → 默认禁用
  doubao:
    enabled: false
    driver: doubao
    url: https://www.doubao.com/chat
    locale: zh-CN
    models:
      - {name: doubao-web, ui_label: "豆包"}
    selectors:
      input:                    # 实测（游客页）：tiptap / ProseMirror contenteditable
        - "div.tiptap.ProseMirror[contenteditable='true']"
        - "div[contenteditable='true']"
      type_prompt: true
      send_button: []           # ⚠ 待实测（输入后才出现）
      response_container:       # ⚠ 待实测（游客页 DOM 里见 .message-container / .chat-item）
        - ".message-container"
        - ".chat-item"
      thinking_container: []
      stop_button: []           # ⚠ 待实测
      login_check: []           # ⚠ 待实测（空 = 用 input 判定；未登录时豆包不渲染输入框）
      upload_input: []          # ⚠ 待实测
    login:
      mode: manual
      hint: "豆包无密码登录（手机号验证码/扫码）→ 宿主执行 ./scripts/login.sh doubao 手动登录一次"
    queue: {max_size: 10, timeout: 60}
    response_timeout: 180
    poll_interval: 0.2
    stable_polls: 20
    min_wait_before_stable: 8.0

  # 智谱清言（chatglm.cn）：**仅手动登录** + 前置**阿里云 WAF 滑动验证**
  # headless/headful 实测都被拦在「访问验证：请按住滑块拖动到最右边」→ 需人工在宿主过验证
  glm:
    enabled: false
    driver: glm
    url: https://chatglm.cn/main/alltoolsdetail?lang=zh
    locale: zh-CN
    models:
      - {name: glm-web, ui_label: "智谱清言"}
    selectors:
      input: []                 # ⚠ 待实测（须先过 WAF）
      send_button: []
      response_container: []
      thinking_container: []
      stop_button: []
      login_check: []
      upload_input: []
    login:
      mode: manual
      hint: "chatglm.cn 前置阿里云 WAF 滑块且无密码登录：请在**有显示器的宿主**执行 ./scripts/login.sh glm 手动过验证并登录，再导入登录态"
    queue: {max_size: 10, timeout: 60}
    response_timeout: 180
