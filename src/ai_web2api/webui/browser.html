<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="ai-web2api — 实时画面（只读）：查看当前 provider 的浏览器界面">
<title>ai-web2api · 实时画面</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff'%3E%E2%97%88%3C/text%3E%3C/svg%3E">
<script src="assets/js/theme.js"></script>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/browser.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">◈</span>
    <div class="brand-text">
      <h1>ai-web2api</h1>
      <span class="sub">实时画面 · 只读</span>
    </div>
  </div>
  <nav class="nav">
    <a href="/ui/">状态面板</a>
    <a href="/ui/playground.html">Playground</a>
    <a href="/ui/threads.html">会话</a>
    <a class="active" href="/ui/browser.html">画面</a>
    <a href="/docs" target="_blank" rel="noopener">API 文档</a>
  </nav>
  <span class="spacer"></span>
  <a class="gh-star" data-gh-star href="https://github.com/yaohuiwu/ai-web2api" target="_blank" rel="noopener" title="在 GitHub 上 Star 支持一下">
    <span class="gh-icon" aria-hidden="true">★</span><span class="gh-count">—</span>
  </a>
  <button class="btn theme-toggle" data-theme-toggle onclick="toggleTheme()" aria-label="切换主题">🌙</button>
</header>

<main>
  <div class="live-warn">⚠ 本接口未鉴权（config.yaml: <code>server.live_view</code>）：同网段可看到你已登录的浏览器，<b>请勿对外暴露</b>。</div>

  <div class="screen-toolbar">
    <label>provider <select id="provider"></select></label>
    <label>帧率
      <select id="fps">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="5" selected>5</option>
        <option value="10">10</option>
        <option value="15">15</option>
      </select>
    </label>
    <label>画质
      <select id="quality">
        <option value="30">30</option>
        <option value="50" selected>50</option>
        <option value="70">70</option>
        <option value="90">90</option>
      </select>
    </label>
    <button class="btn" id="pause">暂停</button>
    <button class="btn" id="save">保存当前帧</button>
    <span class="muted" id="status">加载中…</span>
  </div>

  <div class="screen-wrap">
    <div class="screen-placeholder" id="placeholder">正在连接直播流…</div>
    <img id="live" alt="provider 浏览器实时画面" hidden>
  </div>
</main>

<footer data-footer></footer>

<script src="assets/js/common.js"></script>
<script src="assets/js/browser.js"></script>
</body>
</html>
