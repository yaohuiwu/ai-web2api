<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-web2api · OpenAI 测试</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --border: #e3e6ea;
    --text: #1c2733; --muted: #6b7686;
    --user: #2563eb; --user-bg: #e8f0fe;
    --assistant: #fff; --assistant-border: #e3e6ea;
    --red: #d64545; --red-bg: #fdecec;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header a { color: var(--blue, #2563eb); text-decoration: none; font-size: 13px; }
  header .spacer { flex: 1; }
  .opts { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; }
  .opts label { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
  .opts input[type=checkbox] { accent-color: #2563eb; }
  .opts input[type=text], .opts select, .opts input[type=password] {
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 13px;
    background: #fff; color: var(--text); max-width: 180px;
  }
  .opts select:disabled { opacity: .5; cursor: not-allowed; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px; max-width: 860px; width: 100%; margin: 0 auto;
  }
  .msg { display: flex; margin-bottom: 16px; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 12px;
    white-space: normal; word-break: break-word;
  }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
    margin: 10px 0 6px; line-height: 1.35; font-weight: 600;
  }
  .bubble h1 { font-size: 17px; } .bubble h2 { font-size: 16px; }
  .bubble h3 { font-size: 15px; } .bubble h4 { font-size: 14px; }
  .bubble p { margin: 6px 0; }
  .bubble ul, .bubble ol { margin: 6px 0; padding-left: 22px; }
  .bubble li { margin: 2px 0; }
  .bubble a { color: #2563eb; text-decoration: none; }
  .bubble a:hover { text-decoration: underline; }
  .bubble code {
    background: #f0f2f5; border: 1px solid #e3e6ea; border-radius: 4px;
    padding: 1px 5px; font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .bubble pre {
    background: #1c2733; color: #d6e2f0; border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; margin: 8px 0;
  }
  .bubble pre code {
    background: none; border: none; padding: 0; color: inherit; font-size: 12.5px;
  }
  .bubble blockquote {
    margin: 8px 0; padding: 2px 12px; border-left: 3px solid #d0d5dd;
    color: var(--muted);
  }
  .bubble table {
    border-collapse: collapse; margin: 8px 0; font-size: 13px;
    display: block; overflow-x: auto; max-width: 100%;
  }
  .bubble th, .bubble td {
    border: 1px solid var(--border); padding: 5px 10px; text-align: left;
  }
  .bubble th { background: #f4f6f8; font-weight: 600; }
  .msg.user .bubble { background: var(--user-bg); border: 1px solid #cdddfd; }
  .msg.assistant .bubble {
    background: var(--assistant); border: 1px solid var(--assistant-border);
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .thinking {
    margin: 0 0 8px; padding: 8px 10px; background: #f7f8fa;
    border-left: 3px solid #c9a227; border-radius: 0 6px 6px 0;
    font-size: 12.5px; color: var(--muted); white-space: normal; word-break: break-word;
    max-height: 220px; overflow-y: auto;
  }
  .thinking summary { cursor: pointer; font-weight: 600; user-select: none; }
  .msg.meta { justify-content: center; }
  .msg.meta .bubble {
    background: transparent; border: none; color: var(--muted); font-size: 12px; padding: 2px 0;
  }
  .msg.error .bubble { background: var(--red-bg); border: 1px solid #f3c1c1; color: var(--red); }
  #inputBar {
    border-top: 1px solid var(--border); background: var(--card); padding: 12px 20px;
  }
  #inputWrap { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font: inherit; resize: none; max-height: 160px; outline: none; background: #fff;
  }
  textarea:focus { border-color: #2563eb; }
  .btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 8px 18px; border-radius: 9px; cursor: pointer; font-size: 14px;
  }
  .btn:hover { background: #eef1f5; }
  .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  .btn.primary:hover { background: #1d4ed8; }
  .btn.primary:disabled { opacity: .5; cursor: not-allowed; }
  details.raw { margin-top: 6px; }
  details.raw summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  pre.raw {
    background: #1c2733; color: #d6e2f0; padding: 10px; border-radius: 8px;
    font-size: 12px; overflow-x: auto; max-height: 300px; overflow-y: auto;
    margin: 6px 0 0;
  }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; text-align: center; }
  #layout { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 250px; min-width: 250px; background: var(--card);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .sidebar-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
  }
  .sidebar-head h2 { font-size: 14px; margin: 0; font-weight: 600; }
  .sidebar-head .btn { padding: 4px 10px; font-size: 12px; }
  #threadList { flex: 1; overflow-y: auto; }
  .thread-item {
    padding: 9px 12px; border-bottom: 1px solid var(--border);
    cursor: pointer; border-left: 3px solid transparent;
  }
  .thread-item:hover { background: #eef1f5; }
  .thread-item.active { background: #e8f0fe; border-left-color: #2563eb; }
  .thread-item .tt {
    font-size: 13px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thread-item .tid {
    font-size: 11px; color: var(--muted); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thread-item .arch {
    font-size: 10px; color: #b45309; background: #fef3c7;
    border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: 1px;
  }
  .thread-item .empty { color: var(--muted); font-style: italic; font-size: 12px; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
</style>
</head>
<body>
<header>
  <h1>OpenAI API 测试</h1>
  <a href="/ui/">← 状态面板</a>
  <span class="spacer"></span>
  <div class="opts">
    <label>模型
      <select id="model"><option>加载中…</option></select>
    </label>
    <label><input type="checkbox" id="stream" checked> stream</label>
    <label>thread_id
      <input type="text" id="threadId" placeholder="留空 = 无状态">
    </label>
    <label>mode
      <select id="mode">
        <option value="">默认</option>
        <option value="fast">fast（思考关 + 搜索关）</option>
        <option value="expert">expert（思考开 + 搜索开）</option>
      </select>
    </label>
    <label><input type="checkbox" id="deepThink" checked> 深度思考</label>
    <label><input type="checkbox" id="search" checked> 智能搜索</label>
    <label>API Key
      <input type="password" id="apiKey" placeholder="可选">
    </label>
  </div>
</header>

<div id="layout">
<aside id="sidebar">
  <div class="sidebar-head">
    <h2>会话</h2>
    <button class="btn" id="newChat" title="清空 thread_id，开始无状态新对话">＋ 新会话</button>
  </div>
  <div id="threadList"></div>
</aside>
<main id="main">
<div id="chat">
  <div class="msg meta"><div class="bubble">输入消息开始测试本地 OpenAI 兼容接口（POST /v1/chat/completions）</div></div>
</div>

<div id="inputBar">
  <div id="inputWrap">
    <textarea id="input" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button class="btn primary" id="send">发送</button>
    <button class="btn" id="clear">清空</button>
  </div>
  <div class="hint" id="hint"></div>
</div>
</main>
</div>

<script>
const $ = (s) => document.querySelector(s);
let history = [];       // [{role, content}]
let rawLog = [];        // [{req, res|error}]
let streaming = false;

const apiKeyEl = $("#apiKey");
apiKeyEl.value = localStorage.getItem("aiw2api_api_key") || "";
apiKeyEl.addEventListener("change", () =>
  localStorage.setItem("aiw2api_api_key", apiKeyEl.value));

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// ---- 轻量 markdown 渲染（自包含，无 CDN 依赖；先 esc 防 XSS，再解析标记）----
function mdInline(s) {
  s = esc(s);
  // esc 之后注入 <br>（多行段落/引用由调用方用 \n 连接）
  s = s.replace(/\n/g, "<br>");
  // 行内代码（最先，避免 code 内容被二次解析）
  s = s.replace(/`([^`\n]+)`/g, (m, c) => `<code>${c}</code>`);
  // 链接：仅 http(s) 白名单
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    (m, t, u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`);
  // 粗体 / 斜体 / 删除线
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/__([^_\n]+)__/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^_])_([^_\n]+)_/g, "$1<em>$2</em>");
  s = s.replace(/~~([^~\n]+)~~/g, "<del>$1</del>");
  return s;
}

function md(src) {
  src = String(src ?? "").replace(/\r\n/g, "\n");
  const lines = src.split("\n");
  const out = [];
  let i = 0;
  const isList = /^\s*(?:[-*+]|\d+\.)\s+/;
  while (i < lines.length) {
    const line = lines[i];
    // 围栏代码块
    const fence = line.match(/^```([\w+-]*)\s*$/);
    if (fence) {
      const buf = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++; // 跳过闭合围栏
      out.push(`<pre><code${fence[1] ? ` class="lang-${esc(fence[1])}"` : ""}>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }
    // 表格：当前行 |...| 且下一行是分隔行
    if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const header = cells(lines[i]);
      const aligns = lines[i + 1].trim().replace(/^\||\|$/g, "").split("|").map((c) => {
        const t = c.trim();
        if (t.startsWith(":") && t.endsWith(":")) return " style=\"text-align:center\"";
        if (t.endsWith(":")) return " style=\"text-align:right\"";
        return "";
      });
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
      let html = "<table><thead><tr>";
      header.forEach((c, idx) => { html += `<th${aligns[idx] || ""}>${mdInline(c)}</th>`; });
      html += "</tr></thead><tbody>";
      for (const r of rows) {
        html += "<tr>";
        r.forEach((c, idx) => { html += `<td${aligns[idx] || ""}>${mdInline(c)}</td>`; });
        html += "</tr>";
      }
      out.push(html + "</tbody></table>");
      continue;
    }
    // 标题
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      const n = h[1].length;
      out.push(`<h${n}>${mdInline(h[2])}</h${n}>`);
      i++;
      continue;
    }
    // 引用
    if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) {
        buf.push(lines[i].replace(/^>\s?/, ""));
        i++;
      }
      out.push(`<blockquote>${mdInline(buf.join("\n"))}</blockquote>`);
      continue;
    }
    // 列表（无序/有序，单层）
    if (isList.test(line)) {
      const ordered = /^\s*\d+\.\s+/.test(line);
      const items = [];
      while (i < lines.length && isList.test(lines[i])) {
        items.push(lines[i].replace(/^\s*(?:[-*+]|\d+\.)\s+/, ""));
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${items.map((it) => `<li>${mdInline(it)}</li>`).join("")}</${tag}>`);
      continue;
    }
    // 空行
    if (!line.trim()) { i++; continue; }
    // 段落（GFM：单换行 → <br>）
    const buf = [line];
    i++;
    while (i < lines.length && lines[i].trim() && !/^```/.test(lines[i])
      && !/^(#{1,4})\s/.test(lines[i]) && !/^\s*\|/.test(lines[i])
      && !isList.test(lines[i]) && !/^>\s?/.test(lines[i])) {
      buf.push(lines[i++]);
    }
    out.push(`<p>${mdInline(buf.join("\n"))}</p>`);
  }
  return out.join("\n");
}

function addMsg(role, content, opts = {}) {
  const chat = $("#chat");
  const div = document.createElement("div");
  div.className = "msg " + (opts.error ? "error" : role);
  let inner = `<div class="bubble">`;
  if (opts.thinking && opts.thinking.trim()) {
    inner += `<details class="thinking"><summary>💭 思考过程</summary>${md(opts.thinking)}</details>`;
  }
  inner += md(content) + `</div>`;
  div.innerHTML = inner;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addMeta(text) {
  const chat = $("#chat");
  const div = document.createElement("div");
  div.className = "msg meta";
  div.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showRaw(title) {
  const chat = $("#chat");
  const div = document.createElement("div");
  div.className = "msg meta";
  div.innerHTML = `<details class="raw"><summary>${esc(title)}</summary><pre class="raw"></pre></details>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div.querySelector("pre");
}

async function loadModels() {
  try {
    const r = await fetch("/v1/models");
    const data = await r.json();
    const sel = $("#model");
    sel.innerHTML = "";
    for (const m of data.data || []) {
      const opt = document.createElement("option");
      opt.value = m.id;
      opt.textContent = m.id + (m.owned_by ? `  (${m.owned_by})` : "");
      sel.appendChild(opt);
    }
    const stored = localStorage.getItem("aiw2api_model");
    if (stored && [...sel.options].some((o) => o.value === stored)) sel.value = stored;
    if (!sel.value && sel.options.length) sel.value = sel.options[0].value;
  } catch (e) {
    $("#model").innerHTML = `<option>模型列表加载失败: ${esc(e.message)}</option>`;
  }
}

function buildBody(content) {
  const body = {
    model: $("#model").value,
    messages: [...history, { role: "user", content }],
    stream: $("#stream").checked,
    // 开关显式发送：DeepSeek 三模式合并后它们就是唯一的输出控制项
    // （新版页面默认两者都开，与这里的勾选默认值一致）
    deep_think: $("#deepThink").checked,
    search: $("#search").checked,
  };
  const tid = $("#threadId").value.trim();
  if (tid) body.thread_id = tid;
  const mode = $("#mode").value;
  if (mode) body.mode = mode;
  return body;
}

function headers() {
  const h = { "Content-Type": "application/json" };
  const key = apiKeyEl.value.trim();
  if (key) h["Authorization"] = "Bearer " + key;
  return h;
}

function errMsg(body) {
  if (body && body.error && body.error.message) return body.error.message;
  if (body && body.detail) return JSON.stringify(body.detail);
  return "HTTP 错误";
}

async function sendNonStream(body) {
  const res = await fetch("/v1/chat/completions", {
    method: "POST", headers: headers(), body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(errMsg(data));
  rawLog.push({ req: body, res: data });
  const msg = data.choices && data.choices[0] && data.choices[0].message;
  const content = msg ? msg.content : "";
  const th = msg ? msg.reasoning_content : null;
  if (th && !content) {
    // 长思考被稳定判定截断（完整() 返回时正文未生成）→ 明确提示
    addMsg("assistant", "（思考过程已完整输出，但正文未生成——可能因思考过长被结束判定截断，请重试）", { thinking: th });
  } else {
    addMsg("assistant", content || "（空回复）", { thinking: th });
  }
  if (data.thread_id) addMeta(`thread_id: ${data.thread_id}`);
}

async function sendStream(body) {
  const res = await fetch("/v1/chat/completions", {
    method: "POST", headers: headers(), body: JSON.stringify(body),
  });
  if (!res.ok) {
    let data = null;
    try { data = await res.json(); } catch {}
    throw new Error(errMsg(data));
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  let fullContent = "";
  let fullThinking = "";
  let thinkBox = null;
  const bubbleDiv = addMsg("assistant", "");
  const bubble = bubbleDiv.querySelector(".bubble");
  // 正文独立容器：流式更新只写这里，绝不触碰思考块（textContent 整体覆盖会删掉 thinking）
  const contentBox = document.createElement("div");
  contentBox.className = "content";
  bubble.appendChild(contentBox);
  let gotThreadId = false;

  const ensureThinkBox = () => {
    if (thinkBox) return thinkBox;
    thinkBox = document.createElement("details");
    thinkBox.className = "thinking";
    thinkBox.open = true;
    const s = document.createElement("summary");
    s.textContent = "💭 思考过程";
    thinkBox.appendChild(s);
    bubble.insertBefore(thinkBox, contentBox);
    return thinkBox;
  };

  const flushChunk = (delta) => {
    if (!delta) return;
    if (delta.reasoning_content) {
      fullThinking += delta.reasoning_content;
      ensureThinkBox().appendChild(document.createTextNode(delta.reasoning_content));
    }
    if (delta.content) {
      fullContent += delta.content;
      contentBox.textContent = fullContent;
      $("#chat").scrollTop = $("#chat").scrollHeight;
    }
  };

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split("\n");
    buf = lines.pop();
    for (const line of lines) {
      const t = line.trim();
      if (!t.startsWith("data:")) continue;
      const payload = t.slice(5).trim();
      if (payload === "[DONE]") continue;
      let obj;
      try { obj = JSON.parse(payload); } catch { continue; }
      if (obj.error) throw new Error(obj.error.message || "流错误");
      const delta = obj.choices && obj.choices[0] && obj.choices[0].delta;
      if (delta) flushChunk(delta);
      if (obj.thread_id && !gotThreadId) {
        gotThreadId = true;
        addMeta(`thread_id: ${obj.thread_id}`);
      }
    }
  }
  // 收尾：md 渲染（流式期间 textContent 保证顺滑，结束后一次性渲染）
  if (thinkBox && !fullThinking) {
    thinkBox.remove();
  } else if (thinkBox) {
    const open = thinkBox.open;
    thinkBox.innerHTML = "<summary>💭 思考过程</summary>" + md(fullThinking);
    thinkBox.open = open;
  }
  rawLog.push({ req: body, res: { content: fullContent, thinking: fullThinking } });
  if (!fullContent && fullThinking) {
    // 真实 DeepSeek 长思考时，稳定判定可能在正文开始前结束流（已知行为）→ 明确提示
    contentBox.innerHTML = "<p>（思考过程已完整输出，但正文未生成——可能因思考过长被结束判定截断，请重试）</p>";
  } else if (!fullContent && !fullThinking) {
    contentBox.textContent = "（空回复）";
  } else {
    contentBox.innerHTML = md(fullContent);
    // 服务端错误透传（[会话错误]/[错误] 前缀）→ 红色气泡
    if (/^\s*\[(会话错误|错误)\]/.test(fullContent)) {
      bubble.classList.add("error");
      contentBox.style.color = "#dc2626";
    }
  }
}

async function send() {
  const text = $("#input").value.trim();
  if (!text || streaming) return;
  const body = buildBody(text);
  history.push({ role: "user", content: text });
  addMsg("user", text);
  localStorage.setItem("aiw2api_model", body.model);
  const tidUsed = body.thread_id || "";
  if (tidUsed) addMeta(`thread_id: ${tidUsed}（绑定会话，续用只发最后一条）`);
  $("#input").value = "";
  $("#send").disabled = true;
  streaming = true;
  try {
    if (body.stream) await sendStream(body);
    else await sendNonStream(body);
    $("#hint").textContent = "";
  } catch (e) {
    addMsg("error", "请求失败: " + e.message);
    rawLog.push({ req: body, error: e.message });
    $("#hint").textContent = "提示：503 = 未登录；429 = 队列满/thread 超限；409 = thread 冲突或失效";
  } finally {
    streaming = false;
    $("#send").disabled = false;
    $("#input").focus();
    refreshThreads(); // 新 thread 创建后立即出现在左侧
  }
}

$("#send").onclick = send;
$("#clear").onclick = () => {
  history = [];
  $("#chat").innerHTML = `<div class="msg meta"><div class="bubble">已清空。${$("#threadId").value.trim() ? "（thread_id 仍保留，可继续原会话）" : ""}</div></div>`;
};
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("#threadId").addEventListener("change", () => { history = []; });
$("#threadId").addEventListener("input", (e) => {
  const tid = e.target.value.trim();
  // mode 在新版 UI 里等价于开关组合（服务端把 fast/expert 翻译成 深度思考/智能搜索），
  // 开关每次请求都能改 → 绑定 thread 后依旧可切换，不再禁用
  $("#hint").textContent = tid
    ? "已启用会话绑定：首次请求创建会话并注入全部历史，后续 resume 只发最后一条；深度思考/智能搜索可随时切换"
    : "";
});
$("#mode").addEventListener("change", (e) => {
  // mode 预设同步到开关：避免"mode=fast 但深度思考还勾着"这种矛盾参数
  const v = e.target.value;
  if (v === "fast") {
    $("#deepThink").checked = false;
    $("#search").checked = false;
  } else if (v === "expert") {
    $("#deepThink").checked = true;
    $("#search").checked = true;
  }
  $("#hint").textContent = v
    ? "mode 预设已套用到开关（fast = 思考关 + 搜索关，expert = 都开）；每次请求都可切换"
    : "";
});

// ---- 左侧会话列表（GET /admin/threads 轮询；点击切换 thread）----
function refreshThreads() {
  fetch("/admin/threads")
    .then((r) => r.json())
    .then((data) => {
      const cur = $("#threadId").value.trim();
      const list = $("#threadList");
      const items = data.threads || [];
      list.innerHTML = "";
      if (!items.length) {
        list.innerHTML =
          '<div class="thread-item"><div class="empty">暂无会话<br>发送消息后会出现在这里（可切换回访）</div></div>';
        return;
      }
      for (const t of items) {
        const item = document.createElement("div");
        item.className = "thread-item" + (t.thread_id === cur ? " active" : "");
        const title = t.first_message || t.thread_id;
        item.innerHTML =
          `<div class="tt">${esc(title)}${t.loaded === false ? ' <span class="arch">存档</span>' : ""}</div>` +
          `<div class="tid">${esc(t.thread_id)} · ${esc(t.model || "")}</div>`;
        item.onclick = () => switchThread(t.thread_id, t.loaded !== false);
        list.appendChild(item);
      }
    })
    .catch(() => {});
}

function switchThread(tid, loaded = true) {
  if (streaming) return;
  const el = $("#threadId");
  el.value = tid;
  el.dispatchEvent(new Event("input")); // 触发 hint 更新
  history = [];
  // 暂不保存历史消息：切换后聊天区清空，新消息将续用该会话
  $("#chat").innerHTML =
    `<div class="msg meta"><div class="bubble">已切换到会话 <code>${esc(tid)}</code>（${
      loaded ? "历史消息不保留，新消息将续用该会话" : "已保存的会话，发送消息将自动恢复并继续"
    }）</div></div>`;
  refreshThreads();
}

function newChat() {
  if (streaming) return;
  $("#threadId").value = "";
  $("#threadId").dispatchEvent(new Event("input"));
  history = [];
  $("#chat").innerHTML =
    '<div class="msg meta"><div class="bubble">已开始新会话（无 thread_id = 无状态，每次请求独立）</div></div>';
  refreshThreads();
}

$("#newChat").onclick = newChat;
setInterval(refreshThreads, 5000);

loadModels();
refreshThreads();
$("#input").focus();
</script>
</body>
</html>
