<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="ai-web2api — 把网页端 AI 聊天封装成 OpenAI 兼容 API">
<title>ai-web2api · Playground</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff'%3E%E2%97%88%3C/text%3E%3C/svg%3E">
<script src="assets/js/theme.js"></script>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/playground.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">◈</span>
    <div class="brand-text">
      <h1>ai-web2api</h1>
      <span class="sub">Playground · OpenAI 兼容</span>
    </div>
  </div>
  <nav class="nav">
    <a href="/ui/">状态面板</a>
    <a class="active" href="/ui/playground.html">Playground</a>
    <a href="/ui/threads.html">会话</a>
    <a href="/docs" target="_blank" rel="noopener">API 文档</a>
  </nav>
  <span class="spacer"></span>
  <a class="gh-star" data-gh-star href="https://github.com/yaohuiwu/ai-web2api" target="_blank" rel="noopener" title="在 GitHub 上 Star 支持一下">
    <span class="gh-icon" aria-hidden="true">★</span><span class="gh-count">—</span>
  </a>
  <button class="btn theme-toggle" data-theme-toggle onclick="toggleTheme()" aria-label="切换主题">🌙</button>
</header>
<div class="toolbar">
  <div class="opts">
    <label>模型
      <select id="model"><option>加载中…</option></select>
    </label>
    <label><input type="checkbox" id="stream" checked> stream</label>
    <label>thread_id
      <input type="text" id="threadId" placeholder="留空 = 无状态">
    </label>
    <label class="adv-item">mode
      <select id="mode">
        <option value="">默认</option>
        <option value="fast">fast（思考关 + 搜索关）</option>
        <option value="expert">expert（思考开 + 搜索开）</option>
      </select>
    </label>
    <label class="adv-item"><input type="checkbox" id="deepThink" checked> 深度思考</label>
    <label class="adv-item"><input type="checkbox" id="search" checked> 智能搜索</label>
    <label class="adv-item"><input type="checkbox" id="useTools"> 工具</label>
    <label class="adv-item">API Key
      <input type="password" id="apiKey" placeholder="可选">
    </label>
    <button class="btn sm toolbar-toggle" id="advToggle" title="显示/隐藏高级选项">⚙ 更多</button>
    <button class="btn sm" id="rawBtn" title="查看最近请求/响应原始报文">原始报文</button>
  </div>
</div>

<div id="layout">
<aside id="sidebar">
  <div class="sidebar-head">
    <h2>会话</h2>
    <span>
      <button class="btn" id="refreshThreads" title="刷新会话列表">刷新</button>
      <button class="btn" id="newChat" title="清空 thread_id，开始无状态新对话">＋ 新会话</button>
    </span>
  </div>
  <div class="sidebar-search">
    <input type="search" id="threadSearch" placeholder="搜索会话…" autocomplete="off">
  </div>
  <div id="threadList"></div>
</aside>
<main id="main">
<div id="chat">
  <div class="msg meta"><div class="bubble">输入消息开始测试本地 OpenAI 兼容接口（POST /v1/chat/completions）</div></div>
</div>

<div class="tool-panel" id="toolPanel" hidden>
  <div class="tool-row">
    <label>tool_choice
      <select id="toolChoice">
        <option value="auto">auto</option>
        <option value="required">required</option>
        <option value="none">none</option>
      </select>
    </label>
    <label><input type="checkbox" id="autoExec" checked> 自动执行 mock 工具后继续</label>
    <span>内置 mock：get_weather / get_time</span>
  </div>
  <textarea id="toolsJson" rows="6" spellcheck="false"></textarea>
</div>

<div id="inputBar">
  <div id="attachments" class="attachments" hidden></div>
  <div id="inputWrap">
    <button class="btn" id="attachBtn" title="上传图片/视频">📎</button>
    <textarea id="input" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button class="btn primary" id="send">发送</button>
    <button class="btn" id="clear">清空</button>
    <input type="file" id="fileInput" multiple accept="image/*,video/*" hidden>
  </div>
  <div class="hint" id="hint"></div>
</div>
</main>
</div>
<footer data-footer class="compact"></footer>

<script src="assets/js/common.js"></script>
<script src="assets/js/markdown.js"></script>
<script src="assets/js/playground.js"></script>
</body>
</html>
