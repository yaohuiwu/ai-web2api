<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="ai-web2api — 会话（Thread）列表：搜索 / 分页 / 续用">
<title>ai-web2api · 会话</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff'%3E%E2%97%88%3C/text%3E%3C/svg%3E">
<script src="assets/js/theme.js"></script>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/threads.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">◈</span>
    <div class="brand-text">
      <h1>ai-web2api</h1>
      <span class="sub">会话列表 · 搜索 / 分页 / 续用</span>
    </div>
  </div>
  <nav class="nav">
    <a href="/ui/">状态面板</a>
    <a href="/ui/playground.html">Playground</a>
    <a class="active" href="/ui/threads.html">会话</a>
    <a href="/ui/browser.html">画面</a>
    <a href="/docs" target="_blank" rel="noopener">API 文档</a>
  </nav>
  <span class="spacer"></span>
  <a class="gh-star" data-gh-star href="https://github.com/yaohuiwu/ai-web2api" target="_blank" rel="noopener" title="在 GitHub 上 Star 支持一下">
    <span class="gh-icon" aria-hidden="true">★</span><span class="gh-count">—</span>
  </a>
  <button class="btn theme-toggle" data-theme-toggle onclick="toggleTheme()" aria-label="切换主题">🌙</button>
</header>

<main>
  <section class="panel">
    <div class="panel-head">
      <h2>会话</h2>
      <span class="muted" id="summary">加载中…</span>
    </div>

    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索标题 / thread_id / provider / model…" autocomplete="off" aria-label="搜索会话">
      <select id="provider" aria-label="按 provider 过滤"><option value="">全部 provider</option></select>
      <label class="toggle">每页
        <select id="limit" aria-label="每页条数">
          <option value="20" selected>20</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </label>
      <label class="toggle"><input type="checkbox" id="autoRefresh"> 自动刷新</label>
      <button class="btn" id="refreshBtn">刷新</button>
    </div>

    <div id="list" class="thread-cards" aria-live="polite"></div>

    <div class="more-wrap">
      <button class="btn" id="moreBtn" hidden>加载更多</button>
      <span class="muted" id="moreHint"></span>
    </div>
  </section>
</main>

<footer data-footer></footer>

<script src="assets/js/common.js"></script>
<script src="assets/js/threads.js"></script>
</body>
</html>
