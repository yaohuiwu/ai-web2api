<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-web2api · 状态</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --border: #e3e6ea;
    --text: #1c2733; --muted: #6b7686;
    --green: #17a673; --green-bg: #e6f7f0;
    --red: #d64545; --red-bg: #fdecec;
    --blue: #2563eb; --blue-bg: #e8f0fe;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 24px; background: var(--card); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  header a { color: var(--blue); text-decoration: none; font-size: 13px; }
  .btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 13px;
  }
  .btn:hover { background: #eef1f5; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { background: #1d4ed8; }
  .btn.danger { color: var(--red); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .toggle input { accent-color: var(--blue); }
  main { max-width: 1080px; margin: 20px auto; padding: 0 24px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px;
  }
  .card h2 { font-size: 14px; margin: 0 0 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
  .provider { border-left: 4px solid var(--border); }
  .provider.logged-in { border-left-color: var(--green); }
  .provider.logged-out { border-left-color: var(--red); }
  .p-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .p-head .name { font-size: 16px; font-weight: 600; }
  .badge {
    display: inline-block; padding: 1px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 500;
  }
  .badge.ok { background: var(--green-bg); color: var(--green); }
  .badge.no { background: var(--red-bg); color: var(--red); }
  .p-meta { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); word-break: break-all; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    background: #f0f2f5; border-radius: 6px; padding: 1px 8px;
    font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .chip.aliased { background: var(--blue-bg); color: var(--blue); }
  .p-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .p-actions .btn { font-size: 12.5px; padding: 4px 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
  .bar { height: 6px; background: #eef1f5; border-radius: 999px; overflow: hidden; margin: 8px 0 10px; }
  .bar > div { height: 100%; background: var(--blue); border-radius: 999px; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1c2733; color: #fff; padding: 9px 18px; border-radius: 8px;
    font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 99;
  }
  .toast.show { opacity: .95; }
</style>
</head>
<body>
<header>
  <h1>ai-web2api</h1>
  <span class="sub" id="serverLine">—</span>
  <span class="spacer"></span>
  <label class="toggle"><input type="checkbox" id="autoRefresh" checked> 自动刷新 (10s)</label>
  <button class="btn" id="refreshBtn">刷新</button>
  <a href="/ui/playground.html">OpenAI 测试页 →</a>
</header>
<main>
  <section class="grid" id="serverCard"></section>
  <section style="margin-top:16px">
    <div class="card">
      <h2>Provider</h2>
      <div id="providers"></div>
    </div>
  </section>
  <section style="margin-top:16px">
    <div class="card">
      <h2>Thread 会话 <span id="threadCount" style="float:right;text-transform:none"></span></h2>
      <div id="threads"></div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
let timer = null;

function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2600);
}

function fmtUptime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return `${h}h ${pad(m)}m ${pad(s)}s`;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  let body = null;
  try { body = await res.json(); } catch { /* 非 JSON */ }
  if (!res.ok) {
    const msg = body && body.error && body.error.message ? body.error.message
      : (body && body.detail ? JSON.stringify(body.detail) : `HTTP ${res.status}`);
    throw new Error(msg);
  }
  return body;
}

async function load() {
  const data = await api("/admin/status");
  renderServer(data.server);
  renderProviders(data.providers);
  renderThreads(data.threads);
}

function renderServer(s) {
  const keyed = [
    ["版本", s.version], ["运行时间", fmtUptime(s.uptime_seconds)],
    ["监听", `${s.host}:${s.port}`],
    ["headless", s.headless ? "是" : "否"],
    ["定时状态检测", s.status_check ? "开" : "关" + (s.status_check_headless ? "（headless）" : "")],
    ["thread TTL", `${s.thread_ttl}s`],
    ["max_threads", s.max_threads],
    ["thread 并行", s.thread_parallel ? "是" : "否"],
    ["thread 持久化", s.thread_persist ? "是" : "否"],
    ["API Key 鉴权", s.api_keys_configured ? "已配置" : "未启用"],
  ];
  $("#serverCard").innerHTML = `
    <div class="card">
      <h2>服务</h2>
      <dl class="kv">${keyed.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    </div>`;
  $("#serverLine").textContent = `v${s.version} · ${s.host}:${s.port} · 运行 ${fmtUptime(s.uptime_seconds)}`;
}

function renderProviders(providers) {
  const wrap = $("#providers");
  if (!providers.length) { wrap.innerHTML = `<div class="empty">未配置任何 provider</div>`; return; }
  wrap.innerHTML = providers.map((p) => {
    const cls = p.logged_in ? "logged-in" : "logged-out";
    const badge = p.logged_in
      ? `<span class="badge ok">✓ 已登录</span>`
      : `<span class="badge no">✗ 未登录</span>`;
    const chips = [
      ...p.models.map((m) => `<span class="chip">${esc(m)}</span>`),
      ...Object.entries(p.model_aliases || {}).map(
        ([alias, target]) => `<span class="chip aliased" title="别名">${esc(alias)} → ${esc(target)}</span>`
      ),
    ].join("");
    const stateFile = p.has_state_file
      ? `state.json ✓` : `state.json ✗（无持久化登录态）`;
    return `
    <div class="card provider ${cls}">
      <div class="p-head">
        <span class="name">${esc(p.name)}</span> ${badge}
        <span style="margin-left:auto;color:var(--muted);font-size:12px">driver: ${esc(p.driver)}</span>
      </div>
      <div class="p-meta">
        url: ${esc(p.url)}<br>
        登录模式: ${esc(p.login_mode)} · ${esc(stateFile)}<br>
        默认模型: ${esc(p.default_model || "—")} · response_timeout: ${p.response_timeout}s
      </div>
      <div class="chips">${chips}</div>
      <div class="p-actions">
        <button class="btn" onclick="actLoginStatus('${p.name}')">刷新登录状态</button>
        <button class="btn" onclick="actAutoLogin('${p.name}')">自动登录</button>
        <button class="btn" onclick="actManualLogin('${p.name}')">手动登录</button>
        <button class="btn danger" onclick="actLogout('${p.name}')">退出登录</button>
      </div>
    </div>`;
  }).join("");
}

async function actLoginStatus(name) {
  const btn = event.target; btn.disabled = true;
  try {
    const r = await api(`/admin/${name}/login/status`);
    toast(`${name}: ${r.logged_in ? "已登录 ✓" : "未登录 ✗"}`);
    await load();
  } catch (e) { toast(`失败: ${e.message}`); }
  finally { btn.disabled = false; }
}

async function actAutoLogin(name) {
  const btn = event.target; btn.disabled = true;
  try {
    const r = await api(`/admin/${name}/login/auto`, { method: "POST" });
    toast(r.already_logged_in ? `${name}: 已登录，无需重复登录` : `${name}: ${r.ok ? "自动登录成功 ✓" : "失败: " + (r.reason || "")}`);
    await load();
  } catch (e) { toast(`失败: ${e.message}`); }
  finally { btn.disabled = false; }
}

async function actManualLogin(name) {
  const btn = event.target; btn.disabled = true;
  try {
    const r = await api(`/admin/${name}/login/start`, { method: "POST" });
    toast(`已打开登录窗口（需 headless=false 才可见）。完成后点「刷新登录状态」。${r.hint || ""}`);
  } catch (e) { toast(`失败: ${e.message}`); }
  finally { btn.disabled = false; }
}

async function actLogout(name) {
  const btn = event.target; btn.disabled = true;
  try {
    await api(`/admin/${name}/login/logout`, { method: "POST" });
    toast(`${name}: 已退出登录`);
    await load();
  } catch (e) { toast(`失败: ${e.message}`); }
  finally { btn.disabled = false; }
}

function renderThreads(t) {
  $("#threadCount").textContent = `${t.active} / ${t.max}`;
  const wrap = $("#threads");
  if (!t.list.length) { wrap.innerHTML = `<div class="empty">当前没有活跃 thread 会话</div>`; return; }
  const pct = Math.min(100, Math.round((t.active / Math.max(1, t.max)) * 100));
  wrap.innerHTML = `
    <div class="bar"><div style="width:${pct}%"></div></div>
    <table>
      <tr><th>thread_id</th><th>provider</th><th>model</th><th>idle</th><th>URL</th><th></th></tr>
      ${t.list.map((s) => `
        <tr>
          <td class="mono">${esc(s.thread_id)}</td>
          <td>${esc(s.provider)}</td>
          <td class="mono">${esc(s.model)}</td>
          <td>${s.idle_seconds}s</td>
          <td class="mono" title="${esc(s.page_url)}">${esc(s.url_id || "—")}</td>
          <td><button class="btn danger" onclick="killThread('${esc(s.thread_id)}')">销毁</button></td>
        </tr>`).join("")}
    </table>`;
}

async function killThread(id) {
  try {
    await api(`/admin/threads/${encodeURIComponent(id)}`, { method: "DELETE" });
    toast(`thread ${id} 已销毁`);
    await load();
  } catch (e) { toast(`失败: ${e.message}`); }
}

async function refresh() {
  try { await load(); }
  catch (e) {
    $("#serverLine").textContent = "无法连接服务: " + e.message;
    toast("状态加载失败: " + e.message);
  }
}

$("#refreshBtn").onclick = refresh;
$("#autoRefresh").onchange = (e) => {
  clearInterval(timer);
  if (e.target.checked) timer = setInterval(refresh, 10000);
};
if ($("#autoRefresh").checked) timer = setInterval(refresh, 10000);
refresh();
</script>
</body>
</html>
