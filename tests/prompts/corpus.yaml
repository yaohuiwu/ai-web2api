# 本地文本库（live 测试 / 探针取题用）
#
# 为什么要有它：**固定、重复的文本是自动化特征**。实测反复用同一句话打豆包，
# 会被弹人机验证卡片（"请选择所有符合上文描述的图片"），请求直接失败。
# 所以 live 测试与临时探针都从这里**随机取样**，并在报告里记录本次用了哪条。
#
# 约定：
#   - 每条都**离线可答**（不触发联网搜索/工具调用），响应快且稳定；
#   - 按"期望产出形态"分类，便于保真度用例断言（长文 / 代码块 / 表格）；
#   - 同一分类内主题尽量分散（历史、地理、物理、生物、工程、生活、编程、数据…）；
#   - 新增题目直接往对应分类里加，测试会自动随机取用。

