# 端到端验证用配置：把 DeepSeek 驱动指向本地假聊天页（tests/fake_chat.html），无需登录。
# 启动：AI_WEB2API_CONFIG=config.fake.yaml .venv/bin/python -m ai_web2api.main
server:
  host: 127.0.0.1
  port: 8001
  # 测试用小 TTL：thread 空闲 10s 回收；login_check_interval 缩短让清扫尽快跑
  thread_ttl: 10
  max_threads: 4
  thread_parallel: true
  thread_persist: false  # 假页 URL 无会话 id（file:// 不匹配 /a/chat/s/），无需持久化

browser:
  headless: true
  login_check_interval: 5.0

profiles_dir: /tmp/ai-web2api-fake-profiles

providers:
  fake:
    driver: deepseek
    url: file:///Users/yaohuiwu/SourceCode/AI/ai-web2api/tests/fake_chat.html
    models:
      - {name: fake-web}
      - {name: fake-r1}
    selectors:
      input:
        - "textarea#chat-input"
      send_button: []
      response_container:
        - ".ds-markdown"
      thinking_container:
        - ".ds-think"
      stop_button: []
      login_check:
        - "textarea#chat-input"
    queue: {max_size: 5, timeout: 30}
    response_timeout: 60
    poll_interval: 0.15
    stable_polls: 8
    min_wait_before_stable: 1.5
    thread_busy_timeout: 5.0  # 假页 resume 快速判定页面忙
